<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
  <link rel="stylesheet" href="../styles/popup.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <div class="popup-container">
    <div class="form-group">
      <label for="dependency-type">Dependency Type</label>
      <select id="dependency-type" class="select-input">
        <option value="" disabled selected>Select dependency type...</option>
        <option value="blocks">Blocks</option>
        <option value="is-blocked-by">Is Blocked By</option>
        <option value="is-related-to">Is Related To</option>
        <option value="is-duplicate-to">Is Duplicate To</option>
        <option value="is-child-to">Is Child To</option>
        <option value="is-parent-to">Is Parent To</option>
      </select>
    </div>

    <div class="dep-preview">
      <div class="dep-preview-row">
        <div class="dep-preview-dot"></div>
        <span id="dep-preview-current" class="dep-preview-card"></span>
      </div>
      <span id="dep-preview-type-badge" class="dep-preview-type-badge"></span>
      <div class="dep-preview-row">
        <div class="dep-preview-dot"></div>
        <span id="dep-preview-target" class="dep-preview-card dep-preview-placeholder">select a card…</span>
      </div>
    </div>

    <div class="form-group">
      <label for="card-search">Search Cards</label>
      <input
        type="text"
        id="card-search"
        class="text-input"
        placeholder="Type to search cards..."
      >
    </div>

    <div class="cards-list-container">
      <div id="cards-list" class="cards-list">
        <div class="no-cards">Loading cards...</div>
      </div>
    </div>

    <button id="confirm-btn" class="confirm-btn">Add dependency</button>
  </div>

  <div id="snackbar" class="snackbar"></div>

  <script src="../js/views/add-dependency.js"></script>
</body>
</html>
